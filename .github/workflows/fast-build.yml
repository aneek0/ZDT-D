name: Fast build (zdtd + APK only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zdt-d-fast-build
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "37.0"
  ZDT_COMPILE_SDK: 37
  ZDT_COMPILE_SDK_MINOR: 0
  ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
  GRADLE_VERSION: "9.6.0"
  CARGO_PROFILE: release
  CARGO_BUILD_TARGET: aarch64-linux-android
  BUILD_TYPE: Release
  NO_DASHBOARD: "1"
  NDK_VERSION: "27.2.12479018"

permissions:
  contents: write
  models: read

jobs:
  check_changes:
    name: check what changed
    runs-on: ubuntu-latest
    outputs:
      zdtd: ${{ steps.detect.outputs.zdtd }}
      dpi_detector: ${{ steps.detect.outputs.dpi_detector }}
      nfqws_tester: ${{ steps.detect.outputs.nfqws_tester }}
      zdtd_missing: ${{ steps.detect.outputs.zdtd_missing }}
      dpi_detector_missing: ${{ steps.detect.outputs.dpi_detector_missing }}
      nfqws_tester_missing: ${{ steps.detect.outputs.nfqws_tester_missing }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "zdtd=$(echo "$CHANGED" | grep -qE '^rust/zdtd/|^rust/Cargo\.' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dpi_detector=$(echo "$CHANGED" | grep -qE '^rust/dpi-detector/|^rust/Cargo\.' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "nfqws_tester=$(echo "$CHANGED" | grep -qE '^rust/nfqws-tester/|^rust/Cargo\.' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "zdtd_missing=$([ -f prebuilt/bin/arm64-v8a/zdtd ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "dpi_detector_missing=$([ -f prebuilt/bin/arm64-v8a/dpi-detector ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "nfqws_tester_missing=$([ -f prebuilt/bin/arm64-v8a/nfqws-tester ] && echo false || echo true)" >> "$GITHUB_OUTPUT"


  bump_version:
    name: Bump version
    runs-on: ubuntu-latest
    needs: check_changes
    if: github.ref == 'refs/heads/main'
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      version_code: ${{ steps.bump.outputs.version_code }}

    steps:
      - uses: actions/checkout@v6

      - name: Bump patch version in module.prop
        id: bump
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -m1 '^version=' module.prop | cut -d'=' -f2 | tr -d '[:space:]')"
          VERSION_CODE="$(grep -m1 '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '[:space:]')"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::versionCode '$VERSION_CODE' is not numeric"; exit 1; }
          [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::version '$VERSION_NAME' is not X.Y.Z"; exit 1; }
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          NEW_CODE=$((VERSION_CODE + 1))
          sed -i "s/^version=.*/version=${NEW_VERSION}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" module.prop
          grep -E '^(version|versionCode)=' module.prop
          echo "version_name=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.prop
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version_name }} (${{ steps.bump.outputs.version_code }}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  build_zdtd:
    name: build zdtd
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.zdtd == 'true' || needs.check_changes.outputs.zdtd_missing == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install NDK cross-linker
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK_ROOT" ]]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "ndk;$NDK_VERSION"
          fi
          [[ -d "$NDK_ROOT" ]] || NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ANDROID_CC="$NDK_BIN/aarch64-linux-android21-clang"
          ANDROID_AR="$NDK_BIN/llvm-ar"
          ANDROID_RANLIB="$NDK_BIN/llvm-ranlib"
          test -x "$ANDROID_CC" || { echo "::error::C compiler not found"; exit 1; }
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_CC"
            echo "CC_aarch64_linux_android=$ANDROID_CC"
            echo "AR_aarch64_linux_android=$ANDROID_AR"
            echo "RANLIB_aarch64_linux_android=$ANDROID_RANLIB"
          } >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-zdtd-arm64-${{ hashFiles('rust/Cargo.lock', 'rust/zdtd/Cargo.toml') }}
          restore-keys: cargo-zdtd-arm64-

      - name: Build zdtd
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          cargo build --manifest-path rust/zdtd/Cargo.toml --profile "$CARGO_PROFILE" --target aarch64-linux-android

      - name: Collect zdtd
        run: |
          mkdir -p out/artifacts/zdtd
          cp "rust/target/aarch64-linux-android/$CARGO_PROFILE/zdtd" out/artifacts/zdtd/zdtd
          chmod 755 out/artifacts/zdtd/zdtd

      - name: Upload zdtd
        uses: actions/upload-artifact@v7
        with:
          name: zdtd-arm64
          path: out/artifacts/zdtd/zdtd
          retention-days: 1

  build_dpi_detector:
    name: build dpi-detector
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.dpi_detector == 'true' || needs.check_changes.outputs.dpi_detector_missing == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install NDK cross-linker
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK_ROOT" ]]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "ndk;$NDK_VERSION"
          fi
          [[ -d "$NDK_ROOT" ]] || NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ANDROID_CC="$NDK_BIN/aarch64-linux-android21-clang"
          ANDROID_AR="$NDK_BIN/llvm-ar"
          ANDROID_RANLIB="$NDK_BIN/llvm-ranlib"
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_CC"
            echo "CC_aarch64_linux_android=$ANDROID_CC"
            echo "AR_aarch64_linux_android=$ANDROID_AR"
            echo "RANLIB_aarch64_linux_android=$ANDROID_RANLIB"
          } >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-dpi-detector-arm64-${{ hashFiles('rust/Cargo.lock', 'rust/dpi-detector/Cargo.toml') }}
          restore-keys: cargo-dpi-detector-arm64-

      - name: Build dpi-detector
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
          # CLI tool, not the daemon: skip thin LTO to save CI minutes.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --manifest-path rust/dpi-detector/Cargo.toml --profile "$CARGO_PROFILE" --target aarch64-linux-android

      - name: Collect dpi-detector
        run: |
          mkdir -p out/artifacts/dpi-detector/arm64
          cp "rust/target/aarch64-linux-android/$CARGO_PROFILE/dpi-detector" out/artifacts/dpi-detector/arm64/dpi-detector
          chmod 755 out/artifacts/dpi-detector/arm64/dpi-detector

      - name: Upload dpi-detector
        uses: actions/upload-artifact@v7
        with:
          name: dpi-detector-arm64
          path: out/artifacts/dpi-detector/arm64/dpi-detector
          retention-days: 1

  build_nfqws_tester:
    name: build nfqws-tester
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.nfqws_tester == 'true' || needs.check_changes.outputs.nfqws_tester_missing == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install NDK cross-linker
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK_ROOT" ]]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "ndk;$NDK_VERSION"
          fi
          [[ -d "$NDK_ROOT" ]] || NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ANDROID_CC="$NDK_BIN/aarch64-linux-android21-clang"
          ANDROID_AR="$NDK_BIN/llvm-ar"
          ANDROID_RANLIB="$NDK_BIN/llvm-ranlib"
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_CC"
            echo "CC_aarch64_linux_android=$ANDROID_CC"
            echo "AR_aarch64_linux_android=$ANDROID_AR"
            echo "RANLIB_aarch64_linux_android=$ANDROID_RANLIB"
          } >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-nfqws-tester-arm64-${{ hashFiles('rust/Cargo.lock', 'rust/nfqws-tester/Cargo.toml') }}
          restore-keys: cargo-nfqws-tester-arm64-

      - name: Build nfqws-tester
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
          # CLI tool, not the daemon: skip thin LTO to save CI minutes.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --manifest-path rust/nfqws-tester/Cargo.toml --profile "$CARGO_PROFILE" --target aarch64-linux-android

      - name: Collect nfqws-tester
        run: |
          mkdir -p out/artifacts/nfqws-tester/arm64
          cp "rust/target/aarch64-linux-android/$CARGO_PROFILE/nfqws-tester" out/artifacts/nfqws-tester/arm64/nfqws-tester
          chmod 755 out/artifacts/nfqws-tester/arm64/nfqws-tester

      - name: Upload nfqws-tester
        uses: actions/upload-artifact@v7
        with:
          name: nfqws-tester-arm64
          path: out/artifacts/nfqws-tester/arm64/nfqws-tester
          retention-days: 1

  sync_prebuilt:
    name: sync native binaries to prebuilt
    runs-on: ubuntu-latest
    needs:
      - build_zdtd
      - build_dpi_detector
      - build_nfqws_tester
    if: always() && (needs.build_zdtd.result == 'success' || needs.build_dpi_detector.result == 'success' || needs.build_nfqws_tester.result == 'success')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download zdtd
        if: needs.build_zdtd.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: zdtd-arm64
          path: out/sync/zdtd
      - name: Download dpi-detector
        if: needs.build_dpi_detector.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: dpi-detector-arm64
          path: out/sync/dpi-detector
      - name: Download nfqws-tester
        if: needs.build_nfqws_tester.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: nfqws-tester-arm64
          path: out/sync/nfqws-tester

      - name: Stage prebuilt and commit
        run: |
          set -euo pipefail
          SRC=out/sync
          DST=prebuilt/bin/arm64-v8a
          mkdir -p "$DST"
          [ -f "$SRC/zdtd/zdtd" ] && cp -f "$SRC/zdtd/zdtd" "$DST/zdtd" && chmod 755 "$DST/zdtd"
          [ -f "$SRC/dpi-detector/dpi-detector" ] && cp -f "$SRC/dpi-detector/dpi-detector" "$DST/dpi-detector" && chmod 755 "$DST/dpi-detector"
          [ -f "$SRC/nfqws-tester/nfqws-tester" ] && cp -f "$SRC/nfqws-tester/nfqws-tester" "$DST/nfqws-tester" && chmod 755 "$DST/nfqws-tester"
          git config user.email "ci@zdt-d.local"
          git config user.name "ZDT-D CI"
          git add prebuilt/bin/arm64-v8a/zdtd prebuilt/bin/arm64-v8a/dpi-detector prebuilt/bin/arm64-v8a/nfqws-tester
          if git diff --staged --quiet; then
            echo "No prebuilt changes to commit"
          else
            git commit -m "sync prebuilt binaries [skip ci]"
            git push || true
          fi

  build_apk:
    name: build APK
    runs-on: ubuntu-latest
    needs:
      - check_changes
      - build_zdtd
      - build_dpi_detector
      - build_nfqws_tester
      - bump_version
    if: always() && needs.check_changes.result == 'success'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply bumped version
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- module.prop
          grep -E '^(version|versionCode)=' module.prop

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          install_sdk_package() {
            local pkg="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "sdkmanager install $pkg: attempt $attempt/5"
              if sdkmanager "$pkg"; then
                return 0
              fi
              if [[ "$pkg" == platforms\;android-37.* ]]; then
                echo "sdkmanager retry $pkg through preview/canary channel"
                if sdkmanager --channel=3 "$pkg"; then
                  return 0
                fi
              fi
              rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.downloadIntermediates" 2>/dev/null || true
              sleep $((attempt * 8))
            done
            echo "::error::Unable to install Android SDK package: $pkg"
            return 1
          }
          install_sdk_package "platform-tools"
          install_sdk_package "platforms;android-$ANDROID_API_LEVEL"
          install_sdk_package "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Download zdtd
        if: needs.build_zdtd.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: zdtd-arm64
          path: out/artifacts/zdtd
      - name: Download dpi-detector
        if: needs.build_dpi_detector.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: dpi-detector-arm64
          path: out/artifacts/dpi-detector/arm64
      - name: Download nfqws-tester
        if: needs.build_nfqws_tester.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: nfqws-tester-arm64
          path: out/artifacts/nfqws-tester/arm64
      - name: Verify BusyBox from prebuilt
        run: |
          test -s prebuilt/bin/arm64-v8a/busybox
          chmod 755 prebuilt/bin/arm64-v8a/busybox

      - name: Prepare module zip (prebuilt + fresh zdtd)
        run: |
          set -euo pipefail
          MODULE_DIR="out/module_build/module_root"
          MODULE_ZIP="out/module/zdt_module.zip"
          mkdir -p "$MODULE_DIR" out/module
          cp -a module_template/. "$MODULE_DIR/"
          cp -f module.prop "$MODULE_DIR/module.prop"
          sed -i '/^buildType=/d; /^buildNumber=/d' "$MODULE_DIR/module.prop"
          {
            echo "buildType=service"
            echo "buildNumber=${GITHUB_RUN_NUMBER}"
          } >> "$MODULE_DIR/module.prop"
          cp -f "$MODULE_DIR/module.prop" out/module/module.prop
          rm -rf "$MODULE_DIR/zygisk" "$MODULE_DIR/bin" "$MODULE_DIR/prebuilt" "$MODULE_DIR/verify_sum"
          mkdir -p "$MODULE_DIR/prebuilt/bin/arm64-v8a"
          # Fresh zdtd (or fallback to prebuilt)
          if [ -f out/artifacts/zdtd/zdtd ]; then
            cp out/artifacts/zdtd/zdtd "$MODULE_DIR/prebuilt/bin/arm64-v8a/zdtd"
          else
            cp prebuilt/bin/arm64-v8a/zdtd "$MODULE_DIR/prebuilt/bin/arm64-v8a/zdtd"
          fi
          chmod 755 "$MODULE_DIR/prebuilt/bin/arm64-v8a/zdtd"
          # Prebuilt arm64-v8a binaries from repo (skip zdtd — already placed)
          for f in prebuilt/bin/arm64-v8a/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            [ "$name" = "zdtd" ] && continue
            cp "$f" "$MODULE_DIR/prebuilt/bin/arm64-v8a/$name"
            chmod 755 "$MODULE_DIR/prebuilt/bin/arm64-v8a/$name"
            echo "  prebuilt arm64: $name"
          done
          # verify_sum — required by verify.sh at install time
          mkdir -p "$MODULE_DIR/verify_sum/prebuilt/bin"
          while IFS= read -r file; do
            rel="${file#$MODULE_DIR/}"
            mkdir -p "$MODULE_DIR/verify_sum/$(dirname "$rel")"
            (cd "$MODULE_DIR" && sha256sum "$rel" > "verify_sum/$rel.sha256")
          done < <(find "$MODULE_DIR/prebuilt/bin" -type f | sort)
          test -s "$MODULE_DIR/verify_sum/prebuilt/bin/arm64-v8a/zdtd.sha256" || { echo "::error::arm64 zdtd verify sum missing"; exit 1; }
          pushd "$MODULE_DIR" > /dev/null
          zip -1qr "../../../$MODULE_ZIP" .
          popd > /dev/null
          ls -lh "$MODULE_ZIP"

      - name: Locate Gradle project
        run: |
          SETTINGS=$(find . -maxdepth 4 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | grep -v '/build/' | sort | head -1)
          echo "GRADLE_PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Write local.properties
        env:
          ZDT_KEYSTORE_BASE64: ${{ secrets.ZDT_KEYSTORE_BASE64 }}
          ZDT_KEYSTORE_PASSWORD: ${{ secrets.ZDT_KEYSTORE_PASSWORD }}
          ZDT_KEY_ALIAS: ${{ secrets.ZDT_KEY_ALIAS }}
          ZDT_KEY_PASSWORD: ${{ secrets.ZDT_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GRADLE_PROJECT_DIR/local.properties"
          if [[ -n "${ZDT_KEYSTORE_BASE64:-}" && -n "${ZDT_KEYSTORE_PASSWORD:-}" && -n "${ZDT_KEY_ALIAS:-}" && -n "${ZDT_KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="$(pwd)/keystores/zdt-debug.keystore"
            mkdir -p "$(dirname "$KEYSTORE_PATH")"
            printf '%s' "$ZDT_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "storeFile=$KEYSTORE_PATH"
              echo "storePassword=$ZDT_KEYSTORE_PASSWORD"
              echo "keyAlias=$ZDT_KEY_ALIAS"
              echo "keyPassword=$ZDT_KEY_PASSWORD"
            } > "$GRADLE_PROJECT_DIR/keystore.properties"
          fi

      - name: Prepare APK helper assets (arm64-v8a)
        run: |
          # dpi-detector APK asset: fresh > prebuilt > hard error (never ship a broken stub)
          mkdir -p application/app/build/generated/zdt-assets/main/dpi-detector/arm64-v8a
          if [ -f out/artifacts/dpi-detector/arm64/dpi-detector ]; then
            cp out/artifacts/dpi-detector/arm64/dpi-detector application/app/build/generated/zdt-assets/main/dpi-detector/arm64-v8a/dpi-detector
          elif [ -f prebuilt/bin/arm64-v8a/dpi-detector ]; then
            cp prebuilt/bin/arm64-v8a/dpi-detector application/app/build/generated/zdt-assets/main/dpi-detector/arm64-v8a/dpi-detector
          else
            echo "::error::dpi-detector binary missing (no fresh artifact, no prebuilt). Run full build or workflow_dispatch." >&2
            exit 1
          fi
          chmod 755 application/app/build/generated/zdt-assets/main/dpi-detector/arm64-v8a/dpi-detector

          # nfqws-tester APK asset: fresh > prebuilt > hard error (never ship a broken stub)
          mkdir -p application/app/build/generated/zdt-assets/main/nfqws-tester/arm64-v8a
          if [ -f out/artifacts/nfqws-tester/arm64/nfqws-tester ]; then
            cp out/artifacts/nfqws-tester/arm64/nfqws-tester application/app/build/generated/zdt-assets/main/nfqws-tester/arm64-v8a/nfqws_tester
          elif [ -f prebuilt/bin/arm64-v8a/nfqws-tester ]; then
            cp prebuilt/bin/arm64-v8a/nfqws-tester application/app/build/generated/zdt-assets/main/nfqws-tester/arm64-v8a/nfqws_tester
          else
            echo "::error::nfqws-tester binary missing (no fresh artifact, no prebuilt). Run full build or workflow_dispatch." >&2
            exit 1
          fi
          chmod 755 application/app/build/generated/zdt-assets/main/nfqws-tester/arm64-v8a/nfqws_tester

      - name: Build APK
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --build-cache \
            --configuration-cache \
            --max-workers=$(nproc) \
            "-PzdtCompileSdk=$ZDT_COMPILE_SDK" \
            "-PzdtCompileSdkMinor=$ZDT_COMPILE_SDK_MINOR" \
            "assemble$BUILD_TYPE"

      - name: Collect APKs
        run: |
          mkdir -p out/dist
          find application -name "*.apk" -type f | while read apk; do
            cp "$apk" out/dist/
            echo "APK: $apk"
          done
          ls -lh out/dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: zdt-apk
          path: out/dist/*.apk
          retention-days: 7

  publish_release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - bump_version
      - build_apk
    if: always() && needs.build_apk.result == 'success' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply bumped version
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- module.prop
          grep -E '^(version|versionCode)=' module.prop

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: zdt-apk
          path: out/dist

      - name: Publish service-build and stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK_SOURCE="$(find out/dist -name 'app-release.apk' -type f | head -1)"
          if [[ -z "$APK_SOURCE" ]]; then
            APK_SOURCE="$(find out/dist -name '*.apk' -type f | head -1)"
          fi
          test -s "$APK_SOURCE" || { echo "::error::APK not found in out/dist"; exit 1; }

          VERSION_NAME="$(grep -m1 '^version=' module.prop | cut -d'=' -f2 | tr -d '[:space:]')"
          VERSION_CODE="$(grep -m1 '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '[:space:]')"
          [[ -n "$VERSION_NAME" && "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::version info missing"; exit 1; }

          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          REPO_URL="https://github.com/${{ github.repository }}"
          RUN_URL="${REPO_URL}/actions/runs/${{ github.run_id }}"
          BUILD_TIME_UTC="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --- rolling service-build prerelease ---
          SERVICE_TAG="service-build"
          SERVICE_APK="out/dist/ZDT-D-service-build.apk"
          cp -f "$APK_SOURCE" "$SERVICE_APK"
          git tag -f "$SERVICE_TAG" "$FULL_SHA"
          git push -f origin "refs/tags/${SERVICE_TAG}"
          if gh release view "$SERVICE_TAG" >/dev/null 2>&1; then
            gh release edit "$SERVICE_TAG" --title "ZDT-D Service Build" --prerelease
          else
            gh release create "$SERVICE_TAG" --target "$FULL_SHA" --title "ZDT-D Service Build" --prerelease --latest=false --notes "Rolling fast-build prerelease. Latest: v${VERSION_NAME} (${VERSION_CODE}) @ ${SHORT_SHA}"
          fi
          gh release upload "$SERVICE_TAG" "$SERVICE_APK" --clobber

          # --- stable release for the bumped version ---
          STABLE_TAG="V${VERSION_NAME}"
          STABLE_APK="out/dist/app-release.apk"
          if [[ "$APK_SOURCE" != "$STABLE_APK" ]]; then cp -f "$APK_SOURCE" "$STABLE_APK"; fi

          cat > stable_release_notes.md <<EOF_NOTES
          # ZDT-D V${VERSION_NAME}

          Fast-build release.

          ## Release information

          | Field | Value |
          |---|---|
          | Version | \`${VERSION_NAME}\` |
          | Version code | \`${VERSION_CODE}\` |
          | Tag | \`${STABLE_TAG}\` |
          | Commit | [\`${SHORT_SHA}\`](${REPO_URL}/commit/${FULL_SHA}) |
          | Workflow run | [#${{ github.run_number }}](${RUN_URL}) |
          | Build date | \`${BUILD_TIME_UTC}\` |

          <!-- ZDTD_APP_UPDATE_META_START
          {
            "schema": 1,
            "kind": "stable-release",
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "commit": "${FULL_SHA}",
            "shortCommit": "${SHORT_SHA}",
            "workflow": "fast-build.yml",
            "workflowRunId": ${GITHUB_RUN_ID},
            "workflowRunNumber": ${GITHUB_RUN_NUMBER},
            "asset": "app-release.apk",
            "assetReady": true,
            "updatedAt": "${BUILD_TIME_UTC}"
          }
          ZDTD_APP_UPDATE_META_END -->
          EOF_NOTES

          git tag -f "$STABLE_TAG" "$FULL_SHA"
          git push -f origin "refs/tags/${STABLE_TAG}"
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            gh release upload "$STABLE_TAG" "$STABLE_APK" --clobber
            gh release edit "$STABLE_TAG" --title "V ${VERSION_NAME}" --notes-file stable_release_notes.md
          else
            gh release create "$STABLE_TAG" --target "$FULL_SHA" --title "V ${VERSION_NAME}" --notes-file stable_release_notes.md "$STABLE_APK"
          fi

          echo "Published: service-build + ${STABLE_TAG} (v${VERSION_NAME}, code ${VERSION_CODE})"
